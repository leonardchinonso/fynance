name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.0). Leave blank to auto-increment from latest tag."
        required: false
        default: ""
      include_macos:
        description: "Build macOS binary (uses paid Actions minutes)"
        type: boolean
        default: false
      include_windows:
        description: "Build Windows binary (uses paid Actions minutes)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Determine version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            next="${{ github.event.inputs.version }}"
          else
            git fetch --tags
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
            if [ -z "$latest" ]; then
              next="v0.1.0"
            else
              major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
              minor=$(echo "$latest" | cut -d. -f2)
              next="v${major}.$((minor + 1)).0"
            fi
          fi

          echo "Tagging $next"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build binary (linux)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd frontend && npm ci && npm run build
      - run: cargo build --release --manifest-path backend/Cargo.toml
      - run: cp backend/target/release/fynance fynance-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: fynance-linux-x86_64
          path: fynance-linux-x86_64

  build-macos:
    name: Build binary (macos)
    needs: tag
    if: ${{ github.event.inputs.include_macos == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd frontend && npm ci && npm run build
      - run: cargo build --release --manifest-path backend/Cargo.toml --target aarch64-apple-darwin
      - run: cp backend/target/aarch64-apple-darwin/release/fynance fynance-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: fynance-macos-aarch64
          path: fynance-macos-aarch64

  build-windows:
    name: Build binary (windows)
    needs: tag
    if: ${{ github.event.inputs.include_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd frontend && npm ci && npm run build
      - run: cargo build --release --manifest-path backend/Cargo.toml
      - run: cp backend/target/release/fynance.exe fynance-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: fynance-windows-x86_64.exe
          path: fynance-windows-x86_64.exe

  publish:
    name: Publish Docker image & GitHub Release
    needs: [tag, build-linux, build-macos, build-windows]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fynance:latest
            ghcr.io/${{ github.repository_owner }}/fynance:${{ needs.tag.outputs.tag }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=("artifacts/fynance-linux-x86_64/fynance-linux-x86_64")
          if [ "${{ github.event.inputs.include_macos }}" = "true" ]; then
            assets+=("artifacts/fynance-macos-aarch64/fynance-macos-aarch64")
          fi
          if [ "${{ github.event.inputs.include_windows }}" = "true" ]; then
            assets+=("artifacts/fynance-windows-x86_64.exe/fynance-windows-x86_64.exe")
          fi
          gh release create "${{ needs.tag.outputs.tag }}" \
            --title "${{ needs.tag.outputs.tag }}" \
            --generate-notes \
            "${assets[@]}"
